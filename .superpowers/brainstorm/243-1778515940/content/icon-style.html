<h2>图标风格，你倾向哪种？</h2>
<p class="subtitle">两种风格方向，选择你更喜欢的</p>

<div class="cards">
  <div class="card" data-choice="geometric" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#f5f5f5;padding:20px;text-align:center;">
      <svg width="80" height="80" viewBox="0 0 64 64">
        <!-- 气泡 -->
        <rect x="4" y="8" width="56" height="40" rx="10" fill="#4CAF50" opacity="0.9"/>
        <polygon points="44,44 54,44 44,56" fill="#4CAF50" opacity="0.9"/>
        <!-- 内部图标 -->
        <circle cx="22" cy="28" r="4" fill="white" opacity="0.9"/>
        <circle cx="32" cy="28" r="4" fill="white" opacity="0.9"/>
        <circle cx="42" cy="28" r="4" fill="white" opacity="0.9"/>
      </svg>
    </div>
    <div class="card-body">
      <h3>简约几何风</h3>
      <p>聊天气泡图标，内部用简约图形元素。改进现有方案：渐变填充、圆角优化、抗锯齿。</p>
      <div class="pros-cons" style="margin-top:8px;font-size:0.85em;">
        <div class="pros"><h4>优势</h4><ul><li>有应用辨识度（聊天气泡）</li><li>颜色动态切换自然</li><li>无外部依赖</li></ul></div>
        <div class="cons"><h4>劣势</h4><ul><li>受限于 PIL 绘制能力</li><li>精致度上限较低</li></ul></div>
      </div>
    </div>
  </div>

  <div class="card" data-choice="dot" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#f5f5f5;padding:20px;text-align:center;">
      <svg width="80" height="80" viewBox="0 0 64 64">
        <!-- 外圈边框 -->
        <circle cx="32" cy="32" r="28" fill="none" stroke="#333" stroke-width="2" opacity="0.15"/>
        <!-- 主圆点 -->
        <circle cx="32" cy="32" r="20" fill="#4CAF50"/>
        <!-- 内圈高光 -->
        <circle cx="28" cy="26" r="6" fill="white" opacity="0.25"/>
      </svg>
    </div>
    <div class="card-body">
      <h3>纯色圆点 + 状态</h3>
      <p>macOS 风格的状态指示器：纯色圆点 + 细微边框，靠颜色传递状态。</p>
      <div class="pros-cons" style="margin-top:8px;font-size:0.85em;">
        <div class="pros"><h4>优势</h4><ul><li>极简现代、视觉清爽</li><li>状态一目了然</li><li>代码简单、渲染快</li></ul></div>
        <div class="cons"><h4>劣势</h4><ul><li>缺少应用标识</li><li>纯色在大尺寸下显空洞</li></ul></div>
      </div>
    </div>
  </div>
</div>

<p style="margin-top:16px;color:#666;">点击卡片选择，然后在终端里告诉我你的想法。</p>
